
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Studio Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10111b;color:white;
 font-family:Arial,sans-serif;
}
.container{max-width:850px;margin:25px auto;padding:18px}
h1{text-align:center;color:#a18bff}
.card{
 background:#1c1d2c;padding:20px;
 border-radius:15px;margin-top:18px;
}
label{display:block;margin:16px 0 8px;font-weight:bold}
input,textarea,select,button{
 width:100%;padding:13px;border:0;
 border-radius:9px;font-size:15px;
}
input,textarea,select{background:#303144;color:white}
textarea{height:120px}
button{
 background:#7659ff;color:white;
 font-weight:bold;margin-top:12px;cursor:pointer
}
button:disabled{opacity:.5}
#preview{
 width:100%;max-height:400px;
 object-fit:contain;background:#08080d;
 border-radius:12px;margin-top:15px
}
#gallery{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin-top:12px
}
#gallery img{
 width:100%;height:110px;object-fit:cover;
 border-radius:8px
}
#status{text-align:center;color:#b7a8ff;margin:15px}
small{color:#aaa}
</style>
</head>

<body>
<div class="container">

<h1>🎬 AI VIDEO STUDIO PRO</h1>
<p style="text-align:center;color:#aaa">
Multiple Images + Story + Hindi Voice
</p>

<div class="card">

<label>1. Upload 6 or 7 Images</label>
<input type="file" id="images" accept="image/*" multiple>
<small>Select 6 or 7 images in story order.</small>

<div id="gallery"></div>

<label>2. Enter Your Story Prompt</label>
<textarea id="prompt"
placeholder="एक गरीब किसान सुबह अपने खेत में काम करने जाता है। एक दिन उसे खेत में एक रहस्यमयी खजाना मिलता है..."></textarea>

<label>3. Hindi Narration Script</label>
<textarea id="script"
placeholder="यहाँ अपनी हिंदी कहानी लिखें। इसे आवाज में सुनाया जाएगा।"></textarea>

<button onclick="prepareStory()">🧠 Prepare Narration</button>

<label>4. Video Duration</label>
<select id="duration">
<option value="60">1 Minute</option>
<option value="180">3 Minutes</option>
</select>

<label>5. Hindi Voice</label>
<select id="voice">
<option value="auto">Automatic Hindi Voice</option>
</select>

<button onclick="generateVoice()">🔊 Test Hindi Voice</button>

<button onclick="startVideo()" id="start">
🚀 Create My Video
</button>

<button onclick="stopVideo()" style="background:#c33">
Stop Video
</button>

<div id="status">Ready to create your story.</div>

<canvas id="canvas" width="1280" height="720"
style="display:none"></canvas>

<video id="preview" controls style="display:none"></video>

</div>
</div>

<script>
const imageInput=document.getElementById("images");
const gallery=document.getElementById("gallery");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let pictures=[];
let running=false;
let recorder=null;
let animation=null;
let startTime=0;
let duration=60;
let videoStream=null;
let videoUrl=null;

imageInput.addEventListener("change",()=>{
 const files=Array.from(imageInput.files);

 if(files.length<6 || files.length>7){
   alert("Please select 6 or 7 images.");
   imageInput.value="";
   return;
 }

 pictures=[];
 gallery.innerHTML="";

 let loaded=0;

 files.forEach((file,index)=>{
   const url=URL.createObjectURL(file);
   const img=new Image();

   img.onload=()=>{
     pictures[index]=img;
     loaded++;

     const thumb=document.createElement("img");
     thumb.src=url;
     gallery.appendChild(thumb);

     if(loaded===files.length){
       document.getElementById("status").innerText=
       "All "+loaded+" images uploaded successfully!";
     }
   };

   img.src=url;
 });
});

// Prepare narration from prompt
function prepareStory(){
 const prompt=document.getElementById("prompt").value.trim();

 if(!prompt){
   alert("Enter your story prompt first!");
   return;
 }

 // Basic preparation: use the supplied story as narration.
 document.getElementById("script").value=prompt;

 document.getElementById("status").innerText=
 "Narration prepared. You can edit the Hindi script.";
}

// Browser Hindi voice
function getHindiVoice(){
 const voices=speechSynthesis.getVoices();
 return voices.find(v=>v.lang.toLowerCase().startsWith("hi"));
}

function generateVoice(){
 const text=document.getElementById("script").value.trim();

 if(!text){
   alert("Prepare or write your Hindi narration first!");
   return;
 }

 if(!("speechSynthesis" in window)){
   alert("Hindi speech is not supported by this browser.");
   return;
 }

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="hi-IN";
 utterance.rate=0.92;
 utterance.pitch=1;

 const voice=getHindiVoice();
 if(voice) utterance.voice=voice;

 speechSynthesis.speak(utterance);
}

// Draw cinematic image slideshow
function drawScene(progress){
 const w=canvas.width;
 const h=canvas.height;

 const index=Math.min(
   pictures.length-1,
   Math.floor(progress*pictures.length)
 );

 const localProgress=(progress*pictures.length)%1;
 const img=pictures[index];

 ctx.fillStyle="#000";
 ctx.fillRect(0,0,w,h);

 const scale=1.03+localProgress*0.12;
 const imageRatio=img.width/img.height;
 const canvasRatio=w/h;

 let dw,dh;

 if(imageRatio>canvasRatio){
   dh=h*scale;
   dw=dh*imageRatio;
 }else{
   dw=w*scale;
   dh=dw/imageRatio;
 }

 const x=(w-dw)/2;
 const y=(h-dh)/2;

 ctx.drawImage(img,x,y,dw,dh);

 // Fade between images
 const fade=0.12;

 if(localProgress<fade && index>0){
   ctx.globalAlpha=1-localProgress/fade;
   const previous=pictures[index-1];
   const pr=previous.width/previous.height;
   let pw,ph;

   if(pr>canvasRatio){
     ph=h;pw=ph*pr;
   }else{
     pw=w;ph=pw/pr;
   }

   ctx.drawImage(previous,(w-pw)/2,(h-ph)/2,pw,ph);
   ctx.globalAlpha=1;
 }
}

// Generate slideshow and narration
function startVideo(){
 if(pictures.length<6 || pictures.length>7){
   alert("Upload 6 or 7 images first!");
   return;
 }

 const narration=document.getElementById("script").value.trim();

 if(!narration){
   alert("Please prepare your narration first!");
   return;
 }

 if(!window.MediaRecorder || !canvas.captureStream){
   alert("Please use an updated Chrome browser.");
   return;
 }

 speechSynthesis.cancel();

 duration=Number(document.getElementById("duration").value);
 running=true;
 startTime=performance.now();

 videoStream=canvas.captureStream(30);

 const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
 ? "video/webm;codecs=vp9" : "video/webm";

 recorder=new MediaRecorder(videoStream,{mimeType:mime});

 const chunks=[];

 recorder.ondataavailable=e=>{
   if(e.data.size>0) chunks.push(e.data);
 };

 recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:"video/webm"});

   if(videoUrl) URL.revokeObjectURL(videoUrl);
   videoUrl=URL.createObjectURL(blob);

   const preview=document.getElementById("preview");
   preview.src=videoUrl;
   preview.style.display="block";

   const a=document.createElement("a");
   a.href=videoUrl;
   a.download="AI_Story_Video.webm";
   a.click();

   videoStream.getTracks().forEach(t=>t.stop());

   document.getElementById("status").innerText=
   "Video ready! WebM file exported.";
   document.getElementById("start").disabled=false;
 };

 recorder.start();

 // Play narration while slideshow runs
 const utterance=new SpeechSynthesisUtterance(narration);
 utterance.lang="hi-IN";
 utterance.rate=0.92;

 const voice=getHindiVoice();
 if(voice) utterance.voice=voice;

 speechSynthesis.speak(utterance);

 document.getElementById("start").disabled=true;

 function frame(now){
   if(!running)return;

   const elapsed=(now-startTime)/1000;
   const progress=Math.min(elapsed/duration,1);

   drawScene(progress);

   document.getElementById("status").innerText=
   "Creating video: "+Math.floor(progress*100)+"%";

   if(progress<1){
     animation=requestAnimationFrame(frame);
   }else{
     running=false;
     recorder.stop();
   }
 }

 animation=requestAnimationFrame(frame);
}

function stopVideo(){
 running=false;
 cancelAnimationFrame(animation);
 speechSynthesis.cancel();

 if(recorder && recorder.state!=="inactive"){
   recorder.stop();
 }

 document.getElementById("start").disabled=false;
 document.getElementById("status").innerText="Stopped.";
}

</script>
</body>
</html>
